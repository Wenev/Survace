syntax = "proto3";

//option go_package = "github.com/Acad600-TPA/WEB-WE-251/notification-service/internal/adapters/inbound/controller";

option go_package = "github.com/Acad600-TPA/WEB-WE-251/proto/gen/controller";
import "dto/notification.proto";

service NotificationService {
  rpc GetNotificationsByUserID(GetNotificationsByUserIDRequest) returns (GetNotificationsByUserIDResponse);
  rpc MarkAsRead(MarkNotificationRequest) returns (MarkNotificationResponse);
  rpc MarkAsUnread(MarkNotificationRequest) returns (MarkNotificationResponse);
  rpc DeleteNotification(DeleteNotificationRequest) returns (DeleteNotificationResponse);
  rpc DeleteAllNotificationsByUserID(DeleteAllNotificationsByUserIDRequest) returns (DeleteAllNotificationsByUserIDResponse);
  rpc SendNotification(SendNotificationRequest) returns (SendNotificationResponse);
}
