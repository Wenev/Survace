syntax = "proto3";

//option go_package = "github.com/Acad600-TPA/WEB-WE-251/galactus/internal/adapters/inbound/controller";
option go_package = "github.com/Acad600-TPA/WEB-WE-251/proto/gen/controller";
import "dto/galactus.proto";

service GalactusController {
  rpc Register (RegisterRequest) returns (RegisterResponse);
  rpc GoogleRegister (GoogleRegisterRequest) returns (RegisterResponse);
  rpc Login (LoginRequest) returns (LoginResponse);
  rpc GoogleLogin (GoogleLoginRequest) returns (LoginResponse);
  rpc UpdateUser (UpdateUserRequest) returns (UpdateUserResponse);
  rpc SendOTP (SendOTPRequest) returns (SendOTPResponse);
  rpc FindByUserId (FindByUserIdRequest) returns (FindByUserIdResponse);
  rpc FindByUsername (FindByUsernameRequest) returns (FindByUsernameResponse);
  rpc FindUserSetting (FindUserSettingRequest) returns (FindUserSettingResponse);
  rpc EnableNewFollowerNotification (EnableSettingRequest) returns (SettingResponse);
  rpc EnableMessageNotification (EnableSettingRequest) returns (SettingResponse);
  rpc EnableMentionsNotification (EnableSettingRequest) returns (SettingResponse);
  rpc EnableLikeTabVisibility (EnableSettingRequest) returns (SettingResponse);
  rpc EnablePrivateAccount (EnableSettingRequest) returns (SettingResponse);
  rpc EditChatRestriction (EditChatRestrictionRequest) returns (SettingResponse);
  rpc DeleteAccount (DeleteAccountRequest) returns (SettingResponse);
  rpc IsValid (IsValidRequest) returns (IsValidResponse);
  rpc ForgetPassword (ForgetPasswordRequest) returns (ForgetPasswordResponse);
  rpc ResetPassword (ResetPasswordRequest) returns (ResetPasswordResponse);
}