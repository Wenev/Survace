syntax = "proto3";

//option go_package = "github.com/Acad600-TPA/WEB-WE-251/backend/social-service/internal/adapters/inbound/controller";
option go_package = "github.com/Acad600-TPA/WEB-WE-251/proto/gen/controller";
import "dto/social.proto";

service SocialService {
  rpc SendMessage(SendMessageRequest) returns (SendMessageResponse);
  rpc ListMessages(ListMessagesRequest) returns (ListMessagesResponse);
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  rpc ListFollowing(ListFollowingRequest) returns (ListFollowingResponse);
  rpc Follow(FollowRequest) returns (FollowResponse);
  rpc Unfollow(UnfollowRequest) returns (UnfollowResponse);
  rpc ListFollowers(ListFollowingRequest) returns (ListFollowingResponse);
  rpc ListUserMessage(ListUserMessageRequest) returns (ListUserMessageResponse);
  rpc SendChatEvent(ChatEvent) returns (SendMessageResponse);
  rpc SubscribeChatEvents(ListMessagesRequest) returns (stream ChatEvent);
}
