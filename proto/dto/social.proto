syntax = "proto3";

//option go_package = "github.com/Wenev/Survace/backend/social-service/internal/adapters/inbound/dto";
option go_package = "github.com/Wenev/Survace/proto/gen/dto";
import "google/protobuf/timestamp.proto";


message ChatMessage {
  int32 id = 5;
  int32 sender_id = 1;
  int32 receiver_id = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ChatMessageInput {
  int32 sender_id = 1;
  int32 receiver_id = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
}

message SendMessageRequest {
  int32 sender_id = 1;
  int32 receiver_id = 2;
  string content = 3;
}

message SendMessageResponse {
  int32 code = 1;
  string message = 2;
  ChatMessage data = 3;
}

message ListMessagesRequest {
  int32 user_id = 1;
  int32 other_user_id = 2;
}

message ListMessagesResponse {
  int32 code = 1;
  string message = 2;
  repeated ChatMessage data = 3;
}

message ListFriendsRequest {
  int32 user_id = 1;
}

message Friend {
  int32 user_id = 1;
  int32 friend_id = 2;
  google.protobuf.Timestamp created_at = 3;
}

message ListFriendsResponse {
  int32 code = 1;
  string message = 2;
  repeated Friend data = 3;
}

message ListFollowingRequest {
  int32 userId = 1;
}

message ListFollowingResponse {
  int32 code = 1;
  string message = 2;
  repeated Follow data = 3;
}

message FollowRequest {
  int32 user_id = 1;
  int32 target_id = 2;
}

message FollowResponse {
  int32 code = 1;
  string message = 2;
  bool success = 3;
}

message UnfollowRequest {
  int32 user_id = 1;
  int32 target_id = 2;
}

message UnfollowResponse {
  int32 code = 1;
  string message = 2;
  bool success = 3;
}

message Follow {
  int32 id = 1;
  int32 follower_id = 2;
  int32 followee_id = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ChatEvent {
  oneof event {
    ChatMessage message = 1;
    TypingNotification typing = 2;
    UnsendNotification unsend = 3;
  }
}

message TypingNotification {
  int32 sender_id = 1;
  int32 receiver_id = 2;
  bool is_typing = 3;
  int64 room_id = 4;  // Added room_id field for private chat rooms
}

message UnsendNotification {
  int32 message_id = 1;
  int32 sender_id = 2;
  int32 receiver_id = 3;
  int64 room_id = 4;  // Added room_id field for private chat rooms
}


message ListUserMessageRequest {
  int32 user_id = 1;
}

message ListUserMessageResponse {
  int32 code = 1;
  string message = 2;
  repeated int32 user_id = 3;
}
