syntax = "proto3";

//option go_package = "github.com/Acad600-TPA/WEB-WE-251/brainrot-service/internal/adapters/inbound/dto";
option go_package = "github.com/Acad600-TPA/WEB-WE-251/proto/gen/dto";
import "google/protobuf/timestamp.proto";

message UploadVideoRequest {
  string title = 1;
  bytes file = 2;
  int32 userId = 3;
  bool enableComment = 4;
  string visibility = 5;
  bytes thumbnail = 6;
  bool isDraft = 7;
  google.protobuf.Timestamp postDate = 8;
}
message UploadVideoResponse {
  int32 code = 1;
  string message = 2;
  Video video = 3;
}

message GetVideoByIDRequest {
  int32 id = 1;
}
message GetVideoByIDResponse {
  int32 code = 1;
  string message = 2;
  VideoFeed video = 3;
}

message GetUserVideoRequest {
  int32 userId = 1;
}
message GetUserVideoResponse {
  int32 code = 1;
  string message = 2;
  repeated VideoFeed videos = 3;
}

message GetUserVideoAndDraftRequest {
  int32 userId = 1;
}
message GetUserVideoAndDraftResponse {
  int32 code = 1;
  string message = 2;
  repeated VideoFeed videos = 3;
}

message DeleteUserVideoRequest {
  int32 userId = 1;
}
message DeleteUserVideoResponse {
  int32 code = 1;
  string message = 2;
}

message DeleteVideoByIDRequest {
  int32 videoId = 1;
}
message DeleteVideoByIDResponse {
  int32 code = 1;
  string message = 2;
}

message Video {
  int32 id = 1;
  int32 userId = 2;
  string title = 3;
  string url = 4;
  string objectName = 5;
  bool enableComment = 6;
  string visibility = 7;
  google.protobuf.Timestamp createdAt = 8;
  string thumbnailUrl = 9;
  google.protobuf.Timestamp postedAt = 10; // Added
  bool isDraft = 11; // Added
}

message VideoFeed {
  int32 id = 1;
  int32 userId = 2;
  string title = 3;
  string url = 4;
  string objectName = 5;
  bool enableComment = 6;
  string visibility = 7;
  google.protobuf.Timestamp createdAt = 8;
  int32 commentCount = 9;
  int32 likeCount = 10;
  int32 viewCount = 11;
  string thumbnailUrl = 12;
  google.protobuf.Timestamp postedAt = 13; // Added
  bool isDraft = 14; // Added
}

message AddCommentRequest {
  int32 userId = 1;
  int32 videoId = 2;
  string text = 3;
}
message AddCommentResponse {
  int32 code = 1;
  string message = 2;
}

message GetCommentsByVideoRequest {
  int32 videoId = 1;
}
message GetCommentsByVideoResponse {
  int32 code = 1;
  string message = 2;
  repeated CommentFeed comments = 3;
}

message DeleteCommentRequest {
  int32 commentId = 1;
}
message DeleteCommentResponse {
  int32 code = 1;
  string message = 2;
}

message Comment {
  int32 id = 1;
  string content = 2;
  int32 videoId = 3;
  int32 userId = 4;
}

message CommentFeed {
  int32 id = 1;
  string content = 2;
  int32 videoId = 3;
  int32 userId = 4;
  int32 likeCount = 5;
  int32 replyCount = 6;
}

message AddReplyRequest {
  int32 userId = 1;
  int32 commentId = 2;
  string text = 3;
}
message AddReplyResponse {
  int32 code = 1;
  string message = 2;
}

message GetRepliesByCommentRequest {
  int32 commentId = 1;
}
message GetRepliesByCommentResponse {
  int32 code = 1;
  string message = 2;
  repeated ReplyFeed replies = 3;
}

message DeleteReplyRequest {
  int32 replyId = 1;
}
message DeleteReplyResponse {
  int32 code = 1;
  string message = 2;
}

message Reply {
  int32 id = 1;
  string content = 2;
  int32 commentId = 3;
  int32 userId = 4;
}

message ReplyFeed {
  int32 id = 1;
  string content = 2;
  int32 commentId = 3;
  int32 userId = 4;
  int32 likeCount = 6;
}

message LikeVideoRequest {
  int32 userId = 1;
  int32 videoId = 2;
}
message LikeVideoResponse {
  int32 code = 1;
  string message = 2;
}

message UnlikeVideoRequest {
  int32 userId = 1;
  int32 videoId = 2;
}
message UnlikeVideoResponse {
  int32 code = 1;
  string message = 2;
}

message IsVideoLikedRequest {
  int32 userId = 1;
  int32 videoId = 2;
}
message IsVideoLikedResponse {
  bool liked = 1;
}

message LikeCommentRequest {
  int32 userId = 1;
  int32 commentId = 2;
}
message LikeCommentResponse {
  int32 code = 1;
  string message = 2;
}

message UnlikeCommentRequest {
  int32 userId = 1;
  int32 commentId = 2;
}
message UnlikeCommentResponse {
  int32 code = 1;
  string message = 2;
}

message IsCommentLikedRequest {
  int32 userId = 1;
  int32 commentId = 2;
}
message IsCommentLikedResponse {
  bool liked = 1;
}

message LikeReplyRequest {
  int32 replyId = 1;
  int32 userId = 2;
}
message LikeReplyResponse {
  int32 code = 1;
  string message = 2;
}

message UnlikeReplyRequest {
  int32 replyId = 1;
  int32 userId = 2;
}
message UnlikeReplyResponse {
  int32 code = 1;
  string message = 2;
}

message IsReplyLikedRequest {
  int32 replyId = 1;
  int32 userId = 2;
}
message IsReplyLikedResponse {
  bool liked = 1;
}

message WatchVideoRequest {
  int32 userId = 1;
  int32 videoId = 2;
}
message WatchVideoResponse {
  int32 code = 1;
  string message = 2;
}

message GetRandomFeedRequest {
  int32 userId = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message GetRandomFeedResponse {
  int32 code = 1;
  string message = 2;
  repeated VideoFeed videos = 3;
}

message GetRandomFeedLoggedOutRequest {
  int32 limit = 1;
  int32 offset = 2;
}
message GetRandomFeedLoggedOutResponse {
  int32 code = 1;
  string message = 2;
  repeated VideoFeed videos = 3;
}


message SearchVideoRequest {
  string query = 1;
  double threshold = 2;
  int32 limit = 3;
  int32 offset = 4;
}

message SearchVideoResponse {
  int32 code = 1;
  string message = 2;
  repeated VideoFeed videos = 3;
}

message UpdateVideoRequest {
  int32 id = 1;
  int32 userId = 2;
  string title = 3;
  string url = 4;
  string objectName = 5;
  bool enableComment = 6;
  string visibility = 7;
  bytes thumbnail = 8; // Use blob for thumbnail upload
  google.protobuf.Timestamp postedAt = 9;
  bool isDraft = 10;
}

message UpdateVideoResponse {
  int32 code = 1;
  string message = 2;
  Video video = 3;
}

// Playlist messages
message CreatePlaylistRequest {
  int32 userId = 1;
  string title = 2;
}
message CreatePlaylistResponse {
  int32 code = 1;
  string message = 2;
  Playlist playlist = 3;
}

message DeletePlaylistRequest {
  int32 playlistId = 1;
  int32 userId = 2;
}
message DeletePlaylistResponse {
  int32 code = 1;
  string message = 2;
}

message AddVideoToPlaylistRequest {
  int32 playlistId = 1;
  int32 videoId = 2;
  int32 order = 3;
}
message AddVideoToPlaylistResponse {
  int32 code = 1;
  string message = 2;
}

message RemoveVideoFromPlaylistRequest {
  int32 playlistId = 1;
  int32 videoId = 2;
}
message RemoveVideoFromPlaylistResponse {
  int32 code = 1;
  string message = 2;
}

message ReorderVideoRequest {
  int32 playlistId = 1;
  int32 videoId = 2;
  int32 newOrder = 3;
}
message ReorderVideoResponse {
  int32 code = 1;
  string message = 2;
}

message GetUserPlaylistsRequest {
  int32 userId = 1;
}
message GetUserPlaylistsResponse {
  int32 code = 1;
  string message = 2;
  repeated Playlist playlists = 3;
}

message GetPlaylistByIdRequest {
  int32 playlistId = 1;
}
message GetPlaylistByIdResponse {
  int32 code = 1;
  string message = 2;
  Playlist playlist = 3;
}

message UpdatePlaylistTitleRequest {
  int32 playlistId = 1;
  string title = 2;
}
message UpdatePlaylistTitleResponse {
  int32 code = 1;
  string message = 2;
}

message Playlist {
  int32 id = 1;
  int32 userId = 2;
  string title = 3;
  repeated PlaylistVideo videos = 4;
}

message PlaylistVideo {
  int32 playlistId = 1;
  int32 videoId = 2;
  int32 order = 3;
  Video video = 4;
}

message FriendVideoRequest {
  int32 userId = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message FriendVideoResponse {
  int32 code = 1;
  string message = 2;
  repeated VideoFeed videos = 3;
}

message FollowingVideoRequest {
  int32 userId = 1;
  int32 limit = 2;
  int32 offset = 3;
}
message FollowingVideoResponse {
  int32 code = 1;
  string message = 2;
  repeated VideoFeed videos = 3;
}