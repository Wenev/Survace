syntax = "proto3";

option go_package = "github.com/Wenev/Survace/proto/gen/dto";

import "google/protobuf/timestamp.proto";

message StreamChatMessage {
  int32 sender_id = 1;
  int32 call_id = 2;
  string content = 3;
  google.protobuf.Timestamp created_at = 4;
}

message ListLiveStreamsRequest {}

message LiveStreamInfo {
  string user_id = 1;
  string call_id = 2;
}

message ListLiveStreamsResponse {
  int32 code = 1;
  string message = 2;
  repeated LiveStreamInfo streams = 3;
}

message GetStreamTokenRequest {
  string user_id = 1;
}

message GetStreamTokenResponse {
  int32 code = 3;
  string message = 2;
  string token = 1;
  string callId = 4;
}

message GetLiveStreamIdRequest {
  string user_id = 1;
}

message GetLiveStreamIdResponse {
  int32 code = 3;
  string message = 4;
  string stream_id = 1;
  bool is_live = 2;
}

message IsUserLiveRequest {
  string user_id = 1;
}

message IsUserLiveResponse {
  bool is_live = 1;
}

message GoLiveRequest {
  string user_id = 1;
  string call_id = 2;
}

message GoLiveResponse {
  int32 code = 1;
  string message = 2;
}

message StopLiveRequest {
  string user_id = 1;
}

message StopLiveResponse {
  int32 code = 1;
  string message = 2;
}

