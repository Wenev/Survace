syntax = "proto3";

option go_package = "github.com/Acad600-TPA/WEB-WE-251/galactus/internal/adapters/inbound/dto";

import "google/protobuf/timestamp.proto";

message RegisterRequest {
  string username = 1;
  string email = 2;
  string password = 3;
  google.protobuf.Timestamp date_of_birth = 4;
  string OTPCode = 5;
}

message GoogleRegisterRequest {
  string email = 1;
  string username = 2;
}

message RegisterResponse {
  int32 status_code = 1;
  int32 user_id = 2;
  string message = 3;
}

message LoginRequest {
  string email_or_username = 1;
  string password = 2;
}

message GoogleLoginRequest {
  string email = 1;
}

message LoginResponse {
  int32 status_code = 1;
  string token = 2;
  int32 user_id = 3;
  string message = 4;
}

message UpdateUserRequest {
  int32 user_id = 1;
  string username = 2;
  string email = 3;
  string password = 4;
  google.protobuf.Timestamp date_of_birth = 5;
  bool email_verified = 6;
  bytes avatar_blob = 7;
}

message UpdateUserResponse {
  int32 status_code = 1;
  int32 user_id = 2;
  string message = 3;
  string avatar_url = 4;
}

message SendOTPRequest {
  string email = 1;
}

message SendOTPResponse {
  int32 status_code = 1;
  string message = 2;
}

message User {
  int32 user_id = 1;
  string username = 2;
  string email = 3;
  google.protobuf.Timestamp date_of_birth = 5;
  bool email_verified = 6;
  string avatar_url = 7;
}

message FindByUserIdRequest {
  int32 id = 1;
}

message FindByUserIdResponse {
  int32 status_code = 1;
  string message = 2;
  User user = 3;
}